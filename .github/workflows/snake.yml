name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%2330363d,%234f46e5,%237c3aed,%23a855f7,%23e879f9
      - name: Confine snake to contribution squares and remove progress bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              cells = re.findall(r'<rect class="c(?: c\d+)?" x="([0-9.]+)" y="([0-9.]+)"[^>]*/>', svg)
              if len(cells) < 300:
                  raise RuntimeError(f"Contribution grid missing in {path}")
              # Clip the animated snake to the exact union of contribution cells.
              # Unlike a rectangular clip, this hides the snake in gaps and margins.
              squares = ''.join(
                  f'<rect x="{x}" y="{y}" width="12" height="12" rx="2" ry="2"/>'
                  for x, y in cells
              )
              # Solid neutral background: visible in both GitHub themes.
              background = '<rect x="-8" y="-14" width="864" height="134" rx="12" ry="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>'
              svg = svg.replace("</desc>", "</desc>" + background, 1)
              clip = '<defs><clipPath id="snake-cells"' clipPathUnits="userSpaceOnUse">' + squares + '</clipPath></defs>'
              svg = svg.replace("</desc>", "</desc>" + clip, 1)
              svg = re.sub(r'<rect class="u u\d+"[^>]*/>', '', svg)
              snake = re.compile(r'((?:<rect class="s s\d+"[^>]*/>)+)')
              svg, count = snake.subn(lambda m: '<g clip-path="url(#snake-cells)">' + m.group(1) + '</g>', svg, count=1)
              if count != 1:
                  raise RuntimeError(f"Snake elements not found in {path}")
              path.write_text(svg, encoding="utf-8")
          PY
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
