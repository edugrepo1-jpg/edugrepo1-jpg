name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22,%234f46e5,%237c3aed,%23a855f7,%23e879f9
      - name: Keep snake inside contribution grid
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")
              # The grid occupies x=0..848 and y=0..112.
              # Clip only the animated snake, not the contribution cells.
              clip = '<defs><clipPath id="grid-boundary"><rect x="0" y="0" width="848" height="112"/></clipPath></defs>'
              svg = svg.replace("</desc>", "</desc>" + clip, 1)
              snake = re.compile(r'((?:<rect class="s s\d+"[^>]*/>)+)')
              svg, count = snake.subn(r'<g clip-path="url(#grid-boundary)">\1</g>', svg, count=1)
              if count != 1:
                  raise RuntimeError(f"Snake elements not found in {path}")
              path.write_text(svg, encoding="utf-8")
          PY
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
