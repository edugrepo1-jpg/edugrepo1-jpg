name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile enhancements
        uses: actions/checkout@v4
      - name: Generate the GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Optional personal token with read:user scope to count private contributions.
          github_token: ${{ secrets.SNAKE_READ_USER_TOKEN || github.token }}
          outputs: |
            dist/contribution-snake-clean-v2.svg?palette=github&color_snake=%232ea043
            dist/contribution-snake-clean-v2-dark.svg?palette=github-dark&color_snake=%2339d353
      - name: Keep snake in grid and animate level clear
        run: python3 scripts/enhance_snake.py dist
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
